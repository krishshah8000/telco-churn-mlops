name: Automated ML Retraining

on:
  workflow_dispatch:

  schedule:
    # Every Monday at 02:00 UTC
    - cron: "0 2 * * 1"

jobs:
  retrain:
    name: Run ML Retraining Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Run ZenML retraining pipeline
        run: |
          python -m pipelines.retraining_pipeline
